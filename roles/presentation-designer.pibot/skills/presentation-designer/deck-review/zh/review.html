<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/review.css">
<script src="/review.js" defer></script>
<title>Deck review</title>
</head>
<body>
<header>
  <h1 id="title">幻灯片审阅</h1>
  <label id="versionLabel" for="version">版本</label> <select id="version"></select>
  <label id="compareLabel" for="compare">对比版本</label> <select id="compare"></select>
</header>
<main>
  <nav id="thumbnails"></nav>
  <section>
    <h2 id="page">第 1 页</h2>
    <div class="slides">
      <div id="slide"><img id="image" alt=""><div id="pins"></div></div>
      <img id="comparison" alt="" hidden>
    </div>
    <p id="hint"></p>
    <ol id="notes"></ol>
    <section id="editor" hidden>
      <button id="whole" type="button"></button>
      <button id="submit" type="button"></button>
      <button id="retry" type="button" hidden></button>
    </section>
    <p id="status" role="status"></p>
  </section>
</main>
</body>
</html>
